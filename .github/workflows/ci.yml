name: Build and validate Combat Roll
on:
  push:
    branches: [main, "feat/**", "automation/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-roll-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-package:
    name: Rust tests and native bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python tools/package.py --check
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-combat-roll
          path: dist/*.hnmod
          if-no-files-found: error

  horizon-integration:
    name: Stage mixins and check Horizon client
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Fetch exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          HORIZON=$(python -c "import json;print(json.load(open('compatibility.json'))['horizon_revision'])")
          MIXINS=$(python -c "import json;print(json.load(open('compatibility.json'))['horizon_mixins_revision'])")
          git clone --filter=blob:none https://github.com/horizon-rust/horizon.git ../horizon
          git -C ../horizon checkout "$HORIZON"
          # Horizon ships a documentation symlink; horizon-mixins refuses
          # symlinks in its staged source snapshot. Replace these with
          # ordinary copies inside this disposable CI checkout.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("../horizon").resolve()
          for link in root.rglob("*"):
              if not link.is_symlink():
                  continue
              target = link.resolve(strict=True)
              if not target.is_relative_to(root) or not target.is_file():
                  raise RuntimeError(f"unsafe upstream symlink: {link}")
              contents = target.read_bytes()
              link.unlink()
              link.write_bytes(contents)
          PY
          git clone --filter=blob:none https://github.com/horizon-rust/horizon-mixins.git ../horizon-mixins
          git -C ../horizon-mixins checkout "$MIXINS"
      - name: Compile native mixin transformer
        run: cargo build --locked --manifest-path ../horizon-mixins/Cargo.toml -p horizon-mixins-cli
      - name: Validate, apply and compile real Horizon source
        shell: bash
        run: |
          set -euo pipefail
          CLI="../horizon-mixins/target/debug/horizon-mixins"
          "$CLI" plan --workspace ../horizon --mods ./mixins --out "$RUNNER_TEMP/roll-plan.json"
          "$CLI" apply --workspace ../horizon --mods ./mixins --out "$RUNNER_TEMP/roll-horizon"
          cargo check --locked --manifest-path "$RUNNER_TEMP/roll-horizon/Cargo.toml"             -p horizon-client --bin horizon-client --no-default-features

  release:
    name: Publish source bundle after successful main CI
    needs: [rust-and-package, horizon-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-combat-roll
          path: dist
      - name: Create pinned mod release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          PIN=$(python -c "import json;print(json.load(open('compatibility.json'))['horizon_revision'][:12])")
          TAG="v${VERSION}-horizon-${PIN}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refusing to overwrite an immutable pin"
            exit 0
          fi
          gh release create "$TAG" dist/*.hnmod             --title "Combat Roll $VERSION · Horizon $PIN"             --notes "GPL-3.0-only. Native source bundle for the exact pinned Horizon revision. This is an early client-side port, not the original CombatRoll feature set."
